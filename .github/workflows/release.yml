name: Build & Publish

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

# Two runs for one tag would race to move its registry tags and create its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish-to-ghcr:
    name: Build, publish and attest Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, and the published-release lookup
      packages: write # push the image and its attestation to ghcr.io
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the attestation in the GitHub attestations API
      artifact-metadata: write # storage record that links the attestation to the package
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Rebuilding a released version would move its registry tags to an image the
      # immutable release does not describe.
      - name: Refuse to rebuild a published release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1); then
            echo "::error::Release ${GITHUB_REF_NAME} is already published. Release a new version instead."
            exit 1
          elif ! grep -q 'HTTP 404' <<<"$out"; then
            echo "$out"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      # Pushing the attestation to the registry relies on the ghcr.io login above.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Publishing last means a failed build never locks a tag behind an immutable
  # release that has no image.
  create-release:
    needs: build-and-publish-to-ghcr
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
    - name: Create Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        generateReleaseNotes: "true"
        makeLatest: "true"
        body: |
          ## Container image

          ```
          ghcr.io/${{ github.repository }}@${{ needs.build-and-publish-to-ghcr.outputs.digest }}
          ```

          Verify it with `gh attestation verify oci://ghcr.io/${{ github.repository }}@${{ needs.build-and-publish-to-ghcr.outputs.digest }} --repo ${{ github.repository }} --signer-workflow ${{ github.repository }}/.github/workflows/release.yml`.
